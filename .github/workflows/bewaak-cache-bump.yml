name: "🧯 Bewaak de CACHE_NAME-bump"

# Faalt wanneer een precache-bestand uit sw.js wijzigt zonder dat CACHE_NAME
# meebeweegt (dan blijven terugkerende bezoekers op de oude CSS/JS hangen —
# op 2026-09-23 is dat echt gebeurd). Draait alleen als relevante bestanden
# wijzigen; de nachtelijke datacommits raken deze paden nooit.
on:
  pull_request:
    paths: ['css/**', 'js/**', 'index.js', 'index.html', 'sw.js']
  push:
    branches: [master]
    paths: ['css/**', 'js/**', 'index.js', 'index.html', 'sw.js']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vergelijk de wijziging met de CACHE_NAME-regel
        env:
          # PR: de hele branch t.o.v. de basis. Push: alles wat deze push
          # binnenbracht ("before" bestaat niet bij een gloednieuwe branch,
          # maar op master is hij er altijd).
          DIFF_VAN: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_TOT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node backend/controleer-cachebump.js
