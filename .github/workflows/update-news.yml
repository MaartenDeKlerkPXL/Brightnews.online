name: "🚀 BrightNews: Automatische Update"

on:
  schedule:
    # Draait om 00:00 UTC (Nacht-update) en 12:00 UTC (Lunch-update)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Handmatige trigger blijft behouden

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Voorkomt dat een handmatige dispatch en een cron-run tegelijk draaien
    # (en elkaars push laten stranden); wachten i.p.v. afbreken.
    concurrency:
      group: news-update
      cancel-in-progress: false
    permissions:
      contents: write # Nodig om de nieuwe JSON data terug te kunnen pushen

    steps:
      - name: 📂 Code ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Haalt de volledige historie op voor een veiligere push

      - name: 🟢 Node.js instellen
        uses: actions/setup-node@v4
        with:
          # 22+: supabase-js (realtime) vereist native WebSocket; op Node 20
          # crashte createClient zodra de service-key aanwezig was.
          node-version: '22'
          cache: 'npm' # Slaat node_modules op voor snellere volgende runs

      - name: 📦 Dependencies installeren
        run: npm ci

      - name: 🤖 AI Verwerking (Scannen, Filteren & Vertalen)
        env:
          # Primaire provider (Claude-migratie 2026-09-05): Maartens
          # Anthropic-key. De Mistral-fallbacksleuf in de adapter is leeg
          # sinds de key op 2026-09-16 is verwijderd; providers zonder key
          # slaat de keten vanzelf over, dus de env-regel is hier weggehaald.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Nodig om volledige artikeltekst apart van de publieke JSON op te
          # slaan (echte paywall, Fase 1.4). Zet deze zelf in GitHub Secrets:
          # Settings → Secrets and variables → Actions → SUPABASE_SERVICE_ROLE_KEY.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node backend/processor.js

      - name: 📰 Dagoverzichten per categorie (digest)
        # Een mislukte digest mag nooit de nieuws-update (en datacommit) van
        # de processor-stap laten sneuvelen; de volgende run herkanst vanzelf.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node backend/digest.js

      - name: 📄 Statische artikelpagina's genereren
        run: node backend/generate-articles.js

      - name: 📣 Marketing-feed genereren
        run: node backend/generate-marketing-feed.js

      - name: ✍️ Postfabriek (conceptposts voor de cockpit)
        # Marketing mag nooit de nieuws-update laten sneuvelen.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node backend/generate-posts.js

      - name: 🌿 Evergreen-themapagina (wekelijks)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node backend/generate-evergreen.js

      - name: 📊 Weekrapport (wekelijks)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Meetlus: bereik uit GA4 en zoekverkeer uit Search Console. Deze twee
          # mogen ontbreken — dan slaat backend/meetlus.js die sectie over en
          # blijft de rest van het rapport gewoon staan.
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: node backend/generate-rapport.js

      - name: 🗺️ Sitemap & robots.txt genereren
        run: node backend/generate-sitemap.js

      - name: 💾 Wijzigingen opslaan
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "BrightNews Bot ✨"

          # Alleen de nieuws-JSON's plus de gegenereerde sitemap/robots.txt —
          # bewust niet data/*.json, zodat een eventueel ander databestand
          # nooit per ongeluk publiek meegecommit wordt.
          # marketing-posts en rapporten staan sinds 2026-09-26 in Supabase
          # (RLS, team-only) — bedrijfscijfers horen niet in een publieke repo.
          git add data/news_*.json data/seen_links.json data/last_run.json data/selectie-log.json data/digest-log.json data/selectie-archief.jsonl data/marketing-feed.json articles themas sitemap.xml robots.txt

          # Controleer of er echt iets veranderd is voor we committen
          if git diff --quiet && git diff --staged --quiet; then
            echo "Geen nieuwe artikelen gevonden."
          else
            git commit -m "🤖 Automatische nieuws update: $(date -u) [skip ci]"
            # De AI-stap kan lang duren; is de branch intussen opgeschoven, dan
            # zou de push falen en de hele run (incl. AI-kosten) verloren gaan.
            # GITHUB_REF_NAME i.p.v. hard 'master': een workflow_dispatch vanaf
            # een testbranch pusht zo naar die branch en nooit naar master.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      # Draait bewust ná het opslaan: een alarm mag nooit het werk van een
      # geslaagde run weggooien. Faalt deze stap, dan is de data dus wél
      # gecommit en gepusht — je krijgt alleen een melding van GitHub.
      #
      # Aanleiding: 10 t/m 13 september 2026 stond de site drie dagen stil
      # (Anthropic-tegoed op) terwijl elke run "success" meldde en er dus geen
      # mail uitging. Zie backend/controleer-run.js voor wat er precies wordt
      # gecontroleerd.
      - name: "🚨 Controle: heeft deze run echt iets opgeleverd?"
        env:
          # Voor de postfabriek-check (marketing_posts staat in Supabase);
          # zonder deze key wordt alleen die ene deelcheck overgeslagen.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node backend/controleer-run.js