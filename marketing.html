<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://rquuqypgaannrakdrabj.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
    <!-- Marketing-cockpit (fase M1, 2026-09-09): interne teampagina — de
         postfabriek schrijft concepten naar de Supabase-tabel marketing_posts
         (sinds 2026-09-26: site en repo zijn publiek, dus data/ was voor
         iedereen leesbaar; de tabel is met RLS afgeschermd tot team_leden,
         net als het weekrapport in de rapporten-tabel). Hier keurt het team
         ze (goedkeuren/afwijzen-met-reden -> marketing_feedback). Afwijzingen
         voeden de volgende generatie. Bewust alleen Nederlands: teampagina,
         geen i18n-keys nodig. DRAFT-FIRST: hier vertrekt niets vanzelf. -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="assets/brightnews-logo-faviconv5.png">
    <title>Marketing-cockpit | BrightNews</title>
    <script>
        /* Zelfde weergavekeuze als de site (bn-thema, zie de schil van v5). */
        try {
            var bnThema = localStorage.getItem('bn-thema');
            if (bnThema === 'licht' || bnThema === 'donker') {
                document.documentElement.setAttribute('data-theme', bnThema);
            }
        } catch (e) { /* geen opslag: systeem volgen */ }
    </script>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/v5/basis.css">
    <link rel="stylesheet" href="css/v5/componenten.css">
    <script src="js/vendor/supabase-js-2.112.4.js" defer></script>
    <script src="js/supabase-init.js" defer></script>
    <style>
        /* Huisstijl v5: alle kleuren uit css/tokens.css, dus de donkere modus
           volgt vanzelf. */
        body { background: var(--surface-subtle); }
        .cockpit { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }
        .cockpit h1, .cockpit h2 { font-family: var(--font-family-display); font-weight: 600; }
        .cockpit h1 { margin: 22px 0 4px; font-size: 2rem; line-height: 1.2; }
        .cockpit .sub { color: var(--text-secondary); margin: 0 0 28px; }
        .cockpit a:not(.logo) { color: var(--text-link); }
        .melding, .postkaart, .rapport pre {
            background: var(--surface-default); border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
        }
        .melding { padding: 22px; margin-top: 30px; }
        .dagblok { margin-bottom: 36px; }
        .dagkop {
            display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
            border-bottom: 2px solid var(--text-link); padding-bottom: 6px; margin-bottom: 14px;
        }
        .dagkop h2 { margin: 0; font-size: 1.25rem; }
        .dagkop .onderwerp { color: var(--text-secondary); font-size: .95rem; }
        .postkaart { padding: 16px 18px 14px; margin-bottom: 14px; }
        .postkop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .kanaalchip {
            background: var(--action-primary-bg); color: var(--text-on-action); font-weight: 600;
            font-size: .75rem; text-transform: uppercase; letter-spacing: .06em;
            border-radius: var(--radius-full); padding: 4px 12px;
        }
        .status { font-size: .85rem; font-weight: 600; }
        .status.goed { color: var(--feedback-success-fg); }
        .status.afgewezen { color: var(--feedback-error-fg); }
        .taalknoppen { margin-left: auto; display: flex; gap: 4px; }
        .taalknoppen button {
            border: 1px solid var(--border-default); background: var(--surface-default);
            color: var(--text-primary); border-radius: var(--radius-md);
            padding: 3px 9px; cursor: pointer; font: inherit; font-size: .8rem;
        }
        .taalknoppen button.actief {
            background: var(--action-primary-bg); border-color: var(--action-primary-bg);
            color: var(--text-on-action); font-weight: 600;
        }
        .taalknoppen button:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
        .posttekst {
            white-space: pre-wrap; background: var(--surface-muted); color: var(--text-primary);
            border-radius: var(--radius-md); padding: 12px 14px; font-size: .95rem;
        }
        .acties { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .kaartvak { display: none; margin-top: 12px; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
        .kaartvak.open { display: flex; }
        .kaartvak canvas {
            width: 200px; height: 200px; border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
        }
        .kaartvak .uitleg { font-size: .85rem; color: var(--text-secondary); max-width: 340px; margin: 0; }
        .rapport { margin-top: 40px; }
        .rapport pre { padding: 18px; white-space: pre-wrap; font-size: .88rem; overflow-x: auto; color: var(--text-primary); }
        .toast {
            position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: var(--surface-default); border-radius: var(--radius-full);
            padding: 9px 20px; font-size: .9rem; opacity: 0; transition: opacity .25s; pointer-events: none;
        }
        .toast.zichtbaar { opacity: 1; }
    </style>
</head>
<body>
<main class="cockpit" id="cockpit">
    <a class="logo" href="/?team=1" aria-label="BrightNews, naar de homepage">
        <svg class="logo__beeldmerk" viewBox="0 0 39.6151 40" aria-hidden="true">
            <path d="M9 28a11 11 0 0 1 22 0H9Z" fill="#FFC933"/>
            <path d="M35.25 29.5H4.75a1.75 1.75 0 0 0 0 3.5h30.5a1.75 1.75 0 0 0 0-3.5Z" fill="currentColor"/>
            <path d="M20 12.5V8M30.3 17.7l3.2-3.2M9.7 17.7l-3.2-3.2" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="logo__woordmerk">Bright<span>News</span></span>
    </a>
    <h1>Marketing-cockpit</h1>
    <p class="sub">Concepten van de postfabriek — goedkeuren, kopiëren, plaatsen. Afwijzen mét reden maakt de volgende lichting beter. Hier vertrekt niets vanzelf.</p>
    <div id="inhoud"><div class="melding">Laden…</div></div>
    <section class="rapport" id="rapport" hidden>
        <h2>Laatste weekrapport</h2>
        <pre id="rapport-tekst"></pre>
    </section>
</main>
<div class="toast" id="toast"></div>
<script type="module">
import { tekenBeeldkaart, kaartBestandsnaam, downloadKaart } from './js/beeldkaart.js';
(function () {
    const TALEN = ['en', 'nl', 'de', 'fr', 'es'];
    const inhoud = document.getElementById('inhoud');
    let toastTimer = null;

    function toast(tekst) {
        const el = document.getElementById('toast');
        el.textContent = tekst;
        el.classList.add('zichtbaar');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('zichtbaar'), 2200);
    }

    function melding(html) {
        inhoud.innerHTML = '';
        const box = document.createElement('div');
        box.className = 'melding';
        box.innerHTML = html;
        inhoud.appendChild(box);
    }

    async function init() {
        // supabase-init laadt met defer; wacht tot de client er is.
        for (let i = 0; i < 50 && !window.supabaseClient; i++) await new Promise(r => setTimeout(r, 100));
        const client = window.supabaseClient;
        if (!client) return melding('Kon geen verbinding maken. Herlaad de pagina.');

        const { data: { session } } = await client.auth.getSession();
        if (!session) {
            return melding('Log eerst in met je teamaccount via de <a href="profiel.html">profielpagina</a> en kom dan hier terug.');
        }
        // Teamcheck: RLS op team_leden geeft alleen je eigen rij terug.
        const { data: team } = await client.from('team_leden').select('uid').limit(1);
        if (!team || team.length === 0) {
            location.replace('/binnenkort.html');
            return;
        }

        // Concepten uit de afgeschermde tabel (RLS: alleen team_leden).
        const { data: postRijen } = await client
            .from('marketing_posts')
            .select('dag, inhoud')
            .order('dag', { ascending: false })
            .limit(7);
        const dagen = (postRijen || []).map(r => ({ dag: r.dag, ...r.inhoud }));
        if (dagen.length === 0) {
            melding('Nog geen concepten — de postfabriek draait mee met de nieuws-update (2× per dag). Kom na de volgende run terug.');
        } else {
            const { data: feedback } = await client
                .from('marketing_feedback')
                .select('post_key, besluit, reden, created_at')
                .order('created_at', { ascending: true });
            const status = {};
            (feedback || []).forEach(f => { status[f.post_key] = f; });
            render(dagen, status, client);
        }

        // Weekrapport (werkpakket 6) tonen als het er is — zelfde afscherming.
        client.from('rapporten')
            .select('inhoud')
            .order('week', { ascending: false })
            .limit(1)
            .then(({ data }) => {
                const md = data?.[0]?.inhoud;
                if (!md) return;
                document.getElementById('rapport-tekst').textContent = md;
                document.getElementById('rapport').hidden = false;
            });
    }

    function render(dagen, status, client) {
        inhoud.innerHTML = '';
        dagen.forEach(dagItem => {
            const blok = document.createElement('section');
            blok.className = 'dagblok';
            const kop = document.createElement('div');
            kop.className = 'dagkop';
            const h2 = document.createElement('h2');
            h2.textContent = dagItem.dag;
            const ond = document.createElement('span');
            ond.className = 'onderwerp';
            ond.textContent = `${dagItem.onderwerp?.soort ?? ''}: ${dagItem.onderwerp?.titelPerTaal?.en ?? dagItem.onderwerp?.titel ?? ''}`;
            kop.append(h2, ond);
            blok.appendChild(kop);

            Object.keys(dagItem.perTaal?.en ?? dagItem.perTaal?.nl ?? {}).forEach(kanaal => {
                blok.appendChild(maakPostkaart(dagItem, kanaal, status, client));
            });
            inhoud.appendChild(blok);
        });
    }

    function maakPostkaart(dagItem, kanaal, status, client) {
        const postKey = `${dagItem.dag}|${kanaal}`;
        const kaart = document.createElement('article');
        kaart.className = 'postkaart';

        const kop = document.createElement('div');
        kop.className = 'postkop';
        const chip = document.createElement('span');
        chip.className = 'kanaalchip';
        chip.textContent = kanaal;
        const statusEl = document.createElement('span');
        statusEl.className = 'status';
        toonStatus(statusEl, status[postKey]);
        const taalKnoppen = document.createElement('div');
        taalKnoppen.className = 'taalknoppen';
        kop.append(chip, statusEl, taalKnoppen);

        const tekstEl = document.createElement('div');
        tekstEl.className = 'posttekst';
        let actieveTaal = dagItem.perTaal?.en ? 'en' : 'nl';
        function toonTaal(taal) {
            actieveTaal = taal;
            tekstEl.textContent = dagItem.perTaal?.[taal]?.[kanaal] ?? '(ontbreekt)';
            taalKnoppen.querySelectorAll('button').forEach(b => b.classList.toggle('actief', b.dataset.taal === taal));
            if (kaartvak.classList.contains('open')) tekenVoorbeeld();
        }
        TALEN.forEach(taal => {
            if (!dagItem.perTaal?.[taal]?.[kanaal]) return;
            const knop = document.createElement('button');
            knop.dataset.taal = taal;
            knop.textContent = taal.toUpperCase();
            knop.addEventListener('click', () => toonTaal(taal));
            taalKnoppen.appendChild(knop);
        });

        // Beeldkaart — alleen bij Instagram, want daar mag geen link in het
        // bijschrift en hangt de post volledig van het beeld af (punt 53.1).
        const kaartvak = document.createElement('div');
        kaartvak.className = 'kaartvak';
        let doek = null;
        async function tekenVoorbeeld() {
            if (!doek) return;
            const titel = dagItem.onderwerp?.titelPerTaal?.[actieveTaal]
                ?? dagItem.onderwerp?.titel ?? '';
            await tekenBeeldkaart(doek, {
                kop: titel,
                soort: dagItem.onderwerp?.soort,
                taal: actieveTaal,
            });
        }

        const acties = document.createElement('div');
        acties.className = 'acties';
        const kopieer = document.createElement('button');
        kopieer.className = 'btn btn--secondary btn--sm';
        kopieer.textContent = '📋 Kopieer';
        kopieer.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(dagItem.perTaal[actieveTaal][kanaal]);
                toast(`Gekopieerd (${actieveTaal.toUpperCase()})`);
            } catch {
                toast('Kopiëren mislukt — selecteer de tekst handmatig.');
            }
        });
        const goed = document.createElement('button');
        goed.className = 'btn btn--primary btn--sm';
        goed.textContent = '✓ Goedkeuren';
        goed.addEventListener('click', () => stuurFeedback(client, postKey, 'goed', null, statusEl));
        const slecht = document.createElement('button');
        slecht.className = 'btn btn--secondary btn--sm';
        slecht.textContent = '✗ Afwijzen';
        slecht.addEventListener('click', () => {
            const reden = window.prompt('Waarom wijs je deze af? (voedt de volgende generatie)');
            if (reden === null) return;
            stuurFeedback(client, postKey, 'afgewezen', reden.trim() || null, statusEl);
        });
        acties.append(kopieer, goed, slecht);

        if (kanaal === 'instagram') {
            const kaartKnop = document.createElement('button');
            kaartKnop.className = 'btn btn--secondary btn--sm';
            kaartKnop.textContent = '🖼 Beeldkaart';
            kaartKnop.addEventListener('click', async () => {
                if (!doek) {
                    doek = document.createElement('canvas');
                    const uitleg = document.createElement('p');
                    uitleg.className = 'uitleg';
                    uitleg.innerHTML = '1080 × 1080, klaar voor Instagram. '
                        + 'De kaart volgt de taalknoppen hierboven.<br><br>';
                    const download = document.createElement('button');
                    download.className = 'btn btn--primary btn--sm';
                    download.textContent = '⬇ Download PNG';
                    download.addEventListener('click', async () => {
                        try {
                            const titel = dagItem.onderwerp?.titelPerTaal?.[actieveTaal]
                                ?? dagItem.onderwerp?.titel ?? '';
                            await downloadKaart(doek, kaartBestandsnaam(titel, actieveTaal));
                            toast('Beeldkaart gedownload');
                        } catch (e) {
                            toast('Download mislukt: ' + e.message);
                        }
                    });
                    uitleg.appendChild(download);
                    kaartvak.append(doek, uitleg);
                }
                kaartvak.classList.toggle('open');
                if (kaartvak.classList.contains('open')) await tekenVoorbeeld();
            });
            acties.appendChild(kaartKnop);
        }

        kaart.append(kop, tekstEl, acties, kaartvak);
        toonTaal(actieveTaal);
        return kaart;
    }

    function toonStatus(el, f) {
        if (!f) { el.textContent = ''; el.className = 'status'; return; }
        el.className = 'status ' + f.besluit;
        el.textContent = f.besluit === 'goed' ? '✓ goedgekeurd' : '✗ afgewezen' + (f.reden ? ` — ${f.reden}` : '');
    }

    async function stuurFeedback(client, postKey, besluit, reden, statusEl) {
        const { error } = await client.from('marketing_feedback').insert({ post_key: postKey, besluit, reden });
        if (error) { toast('Opslaan mislukt: ' + error.message); return; }
        toonStatus(statusEl, { besluit, reden });
        toast(besluit === 'goed' ? 'Goedgekeurd' : 'Afgewezen — de fabriek leert ervan');
    }

    init();
})();
</script>
</body>
</html>
